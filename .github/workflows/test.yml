# Runs the Rust test suites (runner, core, cli, colony — the workspace's
# default members) on every pull request and every push to main. The macOS
# workflow only builds the app; this is the one that says whether it works.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-linux
      # The app has to know which commit it is, and the macOS workflow is a
      # four-minute way to find out it does not. Exporting the same variable here
      # makes `cargo test` say so in a minute; see the test at the end of
      # crates/core/src/update.rs.
      - name: cargo test
        env:
          BACKSPACE_BUILD: ${{ github.sha }}
        run: cargo test --no-fail-fast
