# Runs the Rust test suites (runner, core, cli, colony — the workspace's
# default members) on every pull request and every push to main. The macOS
# workflow only builds the app; this is the one that says whether it works.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-linux
      # The app has to know which commit it is, and the macOS workflow is a
      # four-minute way to find out it does not. Writing the same file here, and
      # asking the test at the end of crates/core/src/update.rs to agree with it,
      # says so in a minute. See crates/core/src/build_stamp.rs.
      - name: cargo test
        run: |
          printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" \
            > crates/core/src/build_stamp.rs
          cargo test --no-fail-fast
