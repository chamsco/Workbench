# Runs the Rust test suites (runner, core, cli, colony — the workspace's
# default members) on every pull request and every push to main. The macOS
# workflow only builds the app; this is the one that says whether it works.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-linux
      # The app has to know which commit it is, and the macOS workflow is a
      # four-minute way to find out it does not. Writing the same file here, and
      # asking the test at the end of crates/core/src/update.rs to agree with it,
      # says so in a minute. See crates/core/src/build_stamp.rs.
      # M6: agents' commands run in bubblewrap. Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor, which bubblewrap needs.
      # The sandbox tests fail, rather than skip, when it cannot run.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net true
      - name: cargo test
        env:
          BACKSPACE_SANDBOX_TESTS: require
        run: |
          printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" \
            > crates/core/src/build_stamp.rs
          cargo test --no-fail-fast

  # The Cauldron app (crates/app) is not a default member, so `cargo test`
  # above skips it. Its tests run headless (GPUI's test platform): they need
  # the libraries GPUI links against, not a display.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-linux-app
      - name: Install GPUI's libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig-dev libfreetype-dev libssl-dev libvulkan1
      - name: cargo test -p backspace
        run: |
          printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" \
            > crates/core/src/build_stamp.rs
          cargo test -p backspace --no-fail-fast

  # M6: the Seatbelt sandbox and the herdr adapter, on a Mac.
  sandbox-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-macos-sandbox
      - name: Sandbox and herdr tests
        env:
          BACKSPACE_SANDBOX_TESTS: require
        run: cargo test -p backspace-core --test sandbox --test herdr --test workspace_boundary

  # M6: the Windows sandbox (low integrity, mandatory labels, job object).
  sandbox-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-windows-sandbox
      - name: Sandbox and herdr tests
        env:
          BACKSPACE_SANDBOX_TESTS: require
        run: cargo test -p backspace-core --test sandbox --test herdr --test workspace_boundary
