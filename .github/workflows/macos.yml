# Builds Backspace.app and a .dmg for Macs (Apple Silicon and Intel in one
# universal binary). Ad-hoc signed, not notarized: on first open, right-click
# the app → Open, or run `xattr -dr com.apple.quarantine /Applications/Backspace.app`.
name: macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", ".github/workflows/macos.yml"]

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tauri-app/web/package-lock.json

      - name: Build the chat UI
        working-directory: crates/tauri-app/web
        run: npm ci && npm run build

      - name: Icons
        working-directory: crates/tauri-app
        run: npx --yes @tauri-apps/cli@2 icon icons/icon.png -o icons

      - name: Build Backspace.app and .dmg
        working-directory: crates/tauri-app
        # The update check compares the commit you are running with the commit
        # this release is built from, so the build has to know its own. A build
        # without it reports no update, ever: see crates/core/src/update.rs.
        env:
          BACKSPACE_BUILD: ${{ github.sha }}
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg \
            -c '{"bundle":{"active":true,"icon":["icons/icon.icns","icons/icon.png"],"macOS":{"signingIdentity":"-","minimumSystemVersion":"11.0"}}}'

      # If the environment above stops reaching the build, the app silently
      # stops ever seeing an update. Fail the build instead. The bundled binary
      # keeps the crate's name, `backspace-tauri`, not the product name, and
      # both it and the binary cargo produced are checked: a stale bundle must
      # not pass for a stamp that never got baked.
      - name: The app knows which commit it is
        run: |
          short="${GITHUB_SHA:0:7}"
          dir=target/universal-apple-darwin/release
          built="$dir/backspace-tauri"
          bundled=$(find "$dir/bundle/macos/Backspace.app/Contents/MacOS" -type f | head -1)

          # What the build scripts read, which is what the check below finds in
          # the binary. Printed whichever way the check goes: a failure here is
          # about a value crossing three programs, and the log should say which.
          find target -name build_stamp.rs -print -exec cat {} \; || true

          [ -f "$built" ] || { echo "::error::cargo built no $built"; exit 1; }
          [ -n "$bundled" ] || { echo "::error::no binary inside Backspace.app"; exit 1; }
          for bin in "$built" "$bundled"; do
            grep -aq "$short" "$bin" || { echo "::error::no stamp $short in $bin"; exit 1; }
            echo "$bin is stamped with $short"
          done

      - name: Collect
        run: |
          b=target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$b"/dmg/*.dmg out/Backspace-mac.dmg
          ditto -c -k --keepParent "$b/macos/Backspace.app" out/Backspace-mac.app.zip
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Backspace-mac
          path: out/*

      - name: Publish to the "mac-latest" pre-release
        # Only a push to main moves the rolling release. A manual run on a
        # branch is how the build above gets tested, and it must not be mistaken
        # for a build of main.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mac-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "Backspace for Mac (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: right-click Backspace.app → Open the first time, or run: xattr -dr com.apple.quarantine /Applications/Backspace.app"
