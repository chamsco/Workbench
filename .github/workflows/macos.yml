# Builds Backspace.app and a .dmg for Macs (Apple Silicon and Intel in one
# universal binary). Ad-hoc signed, not notarized: on first open, right-click
# the app → Open, or run `xattr -dr com.apple.quarantine /Applications/Backspace.app`.
name: macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", ".github/workflows/macos.yml"]

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tauri-app/web/package-lock.json

      - name: Build the chat UI
        working-directory: crates/tauri-app/web
        run: npm ci && npm run build

      - name: Icons
        working-directory: crates/tauri-app
        run: npx --yes @tauri-apps/cli@2 icon icons/icon.png -o icons

      # The update check compares the commit you are running with the commit the
      # release was built from, so the app has to know its own. It is written into
      # the source the compiler reads, after the cache has been restored and
      # before anything is built: see crates/core/src/build_stamp.rs.
      - name: Say which commit this build is
        run: |
          printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" \
            > crates/core/src/build_stamp.rs
          cat crates/core/src/build_stamp.rs

      - name: Build Backspace.app and .dmg
        working-directory: crates/tauri-app
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg \
            -c '{"bundle":{"active":true,"icon":["icons/icon.icns","icons/icon.png"],"macOS":{"signingIdentity":"-","minimumSystemVersion":"11.0"}}}'

      # If the stamp stops reaching the binary, the app silently stops ever
      # seeing an update, and says so to no one. Fail the build instead. The
      # bundled binary keeps the crate's name, `backspace-tauri`, not the
      # product name.
      #
      # `strings` reads these, not `grep -a`: the grep on this runner (BSD grep
      # 2.6.0-FreeBSD) finds nothing at all in them, not even `chamsco/Workbench`,
      # which is certainly there. Check that first, then the stamp.
      - name: The app knows which commit it is
        run: |
          dir=target/universal-apple-darwin/release
          bundled=$(find "$dir/bundle/macos/Backspace.app/Contents/MacOS" -type f | head -1)
          count() { strings -a "$1" | grep -c -F -- "$2" || true; }

          for bin in "$dir/backspace-tauri" "$bundled"; do
            [ -f "$bin" ] || { echo "::error::no $bin"; exit 1; }
            echo "$bin, $(wc -c < "$bin" | tr -d ' ') bytes"
            # Half of the repo the update check asks for: long enough that the
            # compiler cannot fold it into instructions, so it is a fair test of
            # the reader, and only in the fixed update.rs.
            [ "$(count "$bin" "chamsco/Workbench")" -gt 0 ] \
              || { echo "::error::cannot read a string that is certainly there"; exit 1; }
            n=$(count "$bin" "$GITHUB_SHA")
            echo "   stamp $GITHUB_SHA: $n"
            [ "$n" -gt 0 ] || { echo "::error::no stamp $GITHUB_SHA in $bin"; exit 1; }
          done

      - name: Collect
        run: |
          b=target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$b"/dmg/*.dmg out/Backspace-mac.dmg
          ditto -c -k --keepParent "$b/macos/Backspace.app" out/Backspace-mac.app.zip
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Backspace-mac
          path: out/*

      - name: Publish to the "mac-latest" pre-release
        # Only a push to main moves the rolling release. A manual run on a
        # branch is how the build above gets tested, and it must not be mistaken
        # for a build of main.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mac-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "Backspace for Mac (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: right-click Backspace.app → Open the first time, or run: xattr -dr com.apple.quarantine /Applications/Backspace.app"
