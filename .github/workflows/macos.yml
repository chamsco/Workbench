# Builds Cauldron.app and a .dmg for Macs (Apple Silicon and Intel in one universal
# binary): the GPUI app. Ad-hoc signed, not notarized: on first open, right-click the
# app, then Open, or run `xattr -dr com.apple.quarantine /Applications/Cauldron.app`.
name: macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", ".github/workflows/macos.yml"]

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-gpui

      - name: Say which commit this build is
        run: |
          printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" > crates/core/src/build_stamp.rs

      - name: Test the chrome contract
        run: cargo test -p cauldron-chrome

      - name: Build both architectures
        run: |
          cargo build --release -p backspace --target aarch64-apple-darwin
          cargo build --release -p backspace --target x86_64-apple-darwin

      # A .app is a folder: the universal binary, an Info.plist and nothing else for now.
      # The icon returns with UI8.
      - name: Assemble Cauldron.app and the .dmg
        run: |
          app=out/Cauldron.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/backspace \
            target/x86_64-apple-darwin/release/backspace \
            -output "$app/Contents/MacOS/Cauldron"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Cauldron</string>
            <key>CFBundleIdentifier</key><string>dev.cauldron.app</string>
            <key>CFBundleName</key><string>Cauldron</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "$app"
          hdiutil create -volname Cauldron -srcfolder "$app" -ov -format UDZO out/Cauldron-mac.dmg
          ditto -c -k --keepParent "$app" out/Cauldron-mac.app.zip
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Cauldron-mac
          path: |
            out/Cauldron-mac.dmg
            out/Cauldron-mac.app.zip

      - name: Publish to the "mac-latest" pre-release
        # Only a push to main moves the rolling release. A manual run on a
        # branch is how the build above gets tested, and it must not be mistaken
        # for a build of main.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mac-latest out/Cauldron-mac.dmg out/Cauldron-mac.app.zip --prerelease --target "$GITHUB_SHA" \
            --title "Cauldron for Mac (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: right-click Cauldron.app, then Open, the first time, or run: xattr -dr com.apple.quarantine /Applications/Cauldron.app"
