# Builds Backspace for Windows: an installer (NSIS, fetches WebView2 if the
# machine lacks it) and the bare .exe (runs as is on Windows 10/11, which ship
# WebView2). Unsigned, so SmartScreen warns on first run: More info → Run anyway.
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, app-frame-redesign, "claude/**"]
    paths: ["crates/**", "Cargo.*", ".github/workflows/windows.yml"]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tauri-app/web/package-lock.json

      - name: Build the chat UI
        working-directory: crates/tauri-app/web
        run: npm ci && npm run build

      - name: Icons
        working-directory: crates/tauri-app
        run: npx --yes @tauri-apps/cli@2 icon icons/icon.png -o icons

      # Same stamp as the Mac build: the app knows which commit it is.
      - name: Say which commit this build is
        shell: bash
        run: printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" > crates/core/src/build_stamp.rs

      - name: Build Backspace.exe and its installer
        working-directory: crates/tauri-app
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles nsis \
            -c '{"bundle":{"active":true,"icon":["icons/icon.ico","icons/icon.png"]}}'

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp target/release/backspace-tauri.exe out/Backspace.exe
          cp target/release/bundle/nsis/*-setup.exe out/Backspace-setup.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Backspace-windows
          path: out/*

      # A push to main moves "windows-latest"; any other branch moves
      # "windows-preview", so a branch build is never mistaken for main.
      - name: Publish the pre-release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tag=windows-latest; what="latest main"; else tag=windows-preview; what="${GITHUB_REF_NAME}"; fi
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/* --prerelease --target "$GITHUB_SHA" \
            --title "Backspace for Windows ($what)" \
            --notes "Built from ${GITHUB_SHA::7} on ${what}. Unsigned: Windows SmartScreen will warn the first time; choose More info, then Run anyway. Backspace-setup.exe installs it; Backspace.exe runs without installing."
