# Builds Cauldron for Windows: the GPUI app, one .exe that runs as is on Windows 10/11.
# Unsigned, so SmartScreen warns on first run: More info, then Run anyway.
# The installer returns with UI8 (docs/cauldron/UI-PLAN.md).
name: Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish this build to a version release, e.g. v0.2.0 (empty = build only)"
        type: string
        default: ""
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["crates/**", "Cargo.*", ".github/workflows/windows.yml"]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gpui

      # The app knows which commit it is (the update flow returns with UI8).
      - name: Say which commit this build is
        shell: bash
        run: |
          printf 'pub const BUILD: &str = "%s";\n' "$GITHUB_SHA" > crates/core/src/build_stamp.rs

      - name: Test the chrome contract
        run: cargo test -p cauldron-chrome

      - name: Build Cauldron.exe
        run: cargo build --release -p backspace

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp target/release/backspace.exe out/Cauldron.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Cauldron-windows
          path: out/*
          retention-days: 7

      # A push to main moves the rolling "windows-latest" pre-release. A version
      # tag (v*) adds the build to that version's release, which the macOS
      # workflow fills too. Other branches only build: no preview releases.
      - name: Publish windows-latest
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create windows-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "Cauldron for Windows (latest main)" \
            --notes "Built from ${GITHUB_SHA::7} on main. Unsigned: Windows SmartScreen will warn the first time; choose More info, then Run anyway. Cauldron.exe runs without installing."

      - name: Add to the version release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="${VERSION:-$GITHUB_REF_NAME}"
          # A run started by hand creates the tag on the commit it built.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Cauldron $tag" \
            --notes-file .github/release-notes.md || true
          gh release upload "$tag" out/* --clobber
