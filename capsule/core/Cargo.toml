[package]
name = "visor-core"
version = "0.1.0"
edition = "2021"
description = "visor hypervisor core: Hyper-V + WSL2 workspace lifecycle behind a JSON CLI"

# Standalone: colony owns its own lockfile, so the Workbench workspace's
# default-members stay runner/core/cli/tauri-app.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "6"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
