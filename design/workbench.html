<title>Backspace Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a macOS window floating on a desktop. Frosted sidebar | main column with
   environment tabs in the title bar over the active environment: Terminals (1, 2 or a
   resizable 2x2), Browser (live worktree previews), Diagram (review canvas), PLAN.md. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", Consolas, monospace;
  --desk-base: #efe3ec;
  --blob-a: #ff9ec2; --blob-b: #ffb27d; --blob-c: #a99bff;
  --glass: rgba(252, 249, 252, 0.56);
  --glass-side: rgba(255, 255, 255, 0.26);
  --glass-main: rgba(246, 243, 247, 0.5);
  --glass-edge: rgba(0, 0, 0, 0.14);
  --glass-hi: rgba(255, 255, 255, 0.75);
  --pane: rgba(255, 255, 255, 0.84);
  --pane-edge: rgba(24, 18, 30, 0.10);
  --pane-edge-on: rgba(24, 18, 30, 0.30);
  --fg: #1c1a1f; --fg-2: #4e4955; --fg-3: #7d7785; --fg-4: #a8a2ae;
  --hover: rgba(30, 20, 40, 0.05); --sel: rgba(30, 20, 40, 0.085);
  --pill: rgba(255, 255, 255, 0.5); --pill-on: rgba(255, 255, 255, 0.95); --pill-edge: rgba(24, 18, 30, 0.12);
  --accent: #cf5a24; --blue: #2a66d9; --green: #187f45; --amber: #9a5c00; --red: #bf3a2f; --violet: #6a4fd6;
  --term-fg: #2a2630; --term-dim: #78727f; --prompt-bg: #e8e5eb; --prompt-fg: #1c1a1f;
  --node: rgba(255, 255, 255, 0.95);
  --grid-dot: rgba(30, 20, 40, 0.13);
  --shadow-win: 0 28px 70px rgba(80, 30, 60, 0.28), 0 8px 22px rgba(80, 30, 60, 0.14);
  --page-bg: #ffffff; --page-fg: #1b1a1f; --page-dim: #6f6a76; --page-line: #ebe8ee; --page-accent: #5b47d6; --page-desk: rgba(236, 233, 239, 0.75);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk-base: #160f17; --blob-a: #8a2f5e; --blob-b: #8c4524; --blob-c: #3b2f8f;
    --glass: rgba(36, 30, 38, 0.58); --glass-side: rgba(70, 58, 72, 0.2); --glass-main: rgba(20, 17, 22, 0.48);
    --glass-edge: rgba(255, 255, 255, 0.12); --glass-hi: rgba(255, 255, 255, 0.08);
    --pane: rgba(17, 15, 19, 0.8); --pane-edge: rgba(255, 255, 255, 0.08); --pane-edge-on: rgba(255, 255, 255, 0.24);
    --fg: #ece8ef; --fg-2: #bdb6c3; --fg-3: #8a8390; --fg-4: #5f5965;
    --hover: rgba(255, 255, 255, 0.05); --sel: rgba(255, 255, 255, 0.09);
    --pill: rgba(255, 255, 255, 0.06); --pill-on: rgba(255, 255, 255, 0.16); --pill-edge: rgba(255, 255, 255, 0.12);
    --accent: #f08a5d; --blue: #7aa8ff; --green: #56d18f; --amber: #f2b24c; --red: #ff7a6e; --violet: #a99bff;
    --term-fg: #e6e2ea; --term-dim: #8f8896; --prompt-bg: #e8e5ea; --prompt-fg: #141216;
    --node: rgba(28, 25, 31, 0.95); --grid-dot: rgba(255, 255, 255, 0.08);
    --shadow-win: 0 30px 80px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35);
    --page-bg: #17161b; --page-fg: #ecebf0; --page-dim: #9a96a3; --page-line: #2a2830; --page-accent: #9d8cff; --page-desk: rgba(10, 9, 12, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk-base: #160f17; --blob-a: #8a2f5e; --blob-b: #8c4524; --blob-c: #3b2f8f;
  --glass: rgba(36, 30, 38, 0.58); --glass-side: rgba(70, 58, 72, 0.2); --glass-main: rgba(20, 17, 22, 0.48);
  --glass-edge: rgba(255, 255, 255, 0.12); --glass-hi: rgba(255, 255, 255, 0.08);
  --pane: rgba(17, 15, 19, 0.8); --pane-edge: rgba(255, 255, 255, 0.08); --pane-edge-on: rgba(255, 255, 255, 0.24);
  --fg: #ece8ef; --fg-2: #bdb6c3; --fg-3: #8a8390; --fg-4: #5f5965;
  --hover: rgba(255, 255, 255, 0.05); --sel: rgba(255, 255, 255, 0.09);
  --pill: rgba(255, 255, 255, 0.06); --pill-on: rgba(255, 255, 255, 0.16); --pill-edge: rgba(255, 255, 255, 0.12);
  --accent: #f08a5d; --blue: #7aa8ff; --green: #56d18f; --amber: #f2b24c; --red: #ff7a6e; --violet: #a99bff;
  --term-fg: #e6e2ea; --term-dim: #8f8896; --prompt-bg: #e8e5ea; --prompt-fg: #141216;
  --node: rgba(28, 25, 31, 0.95); --grid-dot: rgba(255, 255, 255, 0.08);
  --shadow-win: 0 30px 80px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35);
  --page-bg: #17161b; --page-fg: #ecebf0; --page-dim: #9a96a3; --page-line: #2a2830; --page-accent: #9d8cff; --page-desk: rgba(10, 9, 12, 0.5);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk-base); color: var(--fg); font: 13px/1.4 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-radius: 4px; }
.ic { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }

/* ---------- desk + window */
.desk {
  position: fixed; inset: 0; overflow: hidden;
  padding: max(env(safe-area-inset-top, 0px), clamp(0px, 2.4vw, 28px)) clamp(0px, 2.4vw, 28px) max(env(safe-area-inset-bottom, 0px), clamp(0px, 2.4vw, 28px));
  display: grid;
}
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.85; animation: drift 26s ease-in-out infinite alternate; }
.blob.a { width: 52vw; height: 52vw; left: -10vw; top: -14vw; background: var(--blob-a); }
.blob.b { width: 46vw; height: 46vw; right: -12vw; top: -6vw; background: var(--blob-b); animation-delay: -9s; }
.blob.c { width: 60vw; height: 60vw; left: 26vw; bottom: -34vw; background: var(--blob-c); animation-delay: -17s; }
@keyframes drift { to { transform: translate(4vw, 3vw) scale(1.08); } }

.win {
  --side-w: 264px;
  position: relative; min-width: 0; min-height: 0;
  display: grid; grid-template-columns: var(--side-w) 1fr;
  border-radius: 12px; overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: blur(48px) saturate(1.7); backdrop-filter: blur(48px) saturate(1.7);
  box-shadow: var(--shadow-win), inset 0 0.5px 0 var(--glass-hi);
  border: 0.5px solid var(--glass-edge);
}
.win.side-closed { --side-w: 0px; }
.lights { position: absolute; top: 13px; left: 14px; display: flex; gap: 8px; z-index: 5; }
.lights span { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; font: 700 9px/1 var(--font-ui); color: transparent; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
.lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
.lights:hover span { color: rgba(0, 0, 0, 0.55); }

/* ---------- sidebar */
.side { min-width: 0; display: flex; flex-direction: column; background: var(--glass-side); border-right: 0.5px solid var(--pane-edge); overflow: hidden; }
.win.side-closed .side { visibility: hidden; }
.side-top { height: 38px; flex: none; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; gap: 2px; }
.side-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 12px 8px; }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.brand .logo { width: 18px; height: 18px; border-radius: 5px; background: var(--fg); color: var(--glass-side); display: grid; place-items: center; }
.brand .logo svg { stroke: var(--desk-base); width: 12px; height: 12px; }
.crumb { color: var(--fg-3); display: flex; align-items: center; gap: 3px; font-size: 12px; }
.seg { flex-basis: 100%; display: flex; gap: 2px; margin-top: 6px; }
.seg button { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; color: var(--fg-3); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--fg); }
.seg button:hover { color: var(--fg); }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 8px; scrollbar-width: thin; }
.row { width: 100%; display: flex; align-items: center; gap: 7px; height: 27px; padding: 0 8px; border-radius: 6px; text-align: left; color: var(--fg); white-space: nowrap; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row .lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .tail { margin-left: auto; color: var(--fg-3); font-size: 11px; display: flex; gap: 6px; align-items: center; }
.row .cnt { color: var(--fg-3); font-size: 11.5px; }
.row.l1 { padding-left: 22px; } .row.l2 { padding-left: 36px; }
.row.group { font-weight: 600; }
.row.muted .lab { color: var(--fg-3); }
.row .agent { color: var(--accent); } .row .web { color: var(--blue); } .row .term { color: var(--fg-3); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-4); flex: none; }
.dot.run { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; } .dot.wait { background: var(--amber); } .dot.done { background: var(--green); }
@keyframes pulse { 50% { opacity: 0.35; } }
.esc { color: var(--amber); font-size: 11px; }
.grp-label { padding: 10px 10px 4px; font-size: 11px; color: var(--fg-3); }
.sub { display: block; font: 11px var(--font-mono); color: var(--fg-3); margin: -3px 0 3px 37px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ports { margin: 6px 8px; padding: 8px 9px; border-radius: 10px; background: var(--pane); border: 0.5px solid var(--pane-edge); }
.ports-h { display: flex; align-items: center; font-size: 11px; color: var(--fg-3); margin-bottom: 4px; }
.ports-h button { margin-left: auto; color: var(--fg-3); display: grid; }
.port { width: 100%; display: flex; align-items: center; gap: 6px; height: 24px; font-size: 12px; border-radius: 5px; padding: 0 3px; }
.port:hover { background: var(--hover); }
.port .pl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.port .pn { font: 11px var(--font-mono); color: var(--green); white-space: nowrap; }
.port .pa { margin-left: auto; display: flex; gap: 6px; color: var(--fg-3); }
.side-foot { height: 34px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; color: var(--fg-3); }
.ib { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--fg-3); flex: none; }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib.on { color: var(--fg); background: var(--sel); }
.gutter-side { position: absolute; top: 0; bottom: 0; width: 7px; margin-left: -3px; cursor: col-resize; z-index: 4; }
.win.side-closed .gutter-side { display: none; }

/* ---------- main column */
.mainc { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--glass-main); }
.tbar { height: 38px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 0 10px; }
.win.side-closed .tbar { padding-left: 84px; }
.tbar .left { display: flex; gap: 2px; }
.tabs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; height: 22px; padding: 0 10px; border-radius: 6px; font-size: 11.5px; white-space: nowrap; background: var(--pill); border: 0.5px solid var(--pill-edge); color: var(--fg-2); display: flex; align-items: center; gap: 5px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--pill-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.tab .badge { position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 1.5px var(--glass); }
.tab.plus { padding: 0 6px; }
.lay { display: flex; gap: 3px; margin-left: 6px; }
.lay button { width: 24px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--fg-3); border: 0.5px solid transparent; }
.lay button[aria-pressed="true"] { background: var(--pill-on); color: var(--fg); border-color: var(--pill-edge); }
.lay svg { width: 16px; height: 12px; }
.right { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.cta { height: 22px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--fg-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cta:hover { background: var(--hover); }
.cta .dot { background: var(--amber); }

.env { flex: 1; min-height: 0; position: relative; padding: 0 6px 6px 6px; }
.env[hidden] { display: none !important; }

/* ---------- terminals grid */
.grid { height: 100%; display: grid; }
.grid.L1 { grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.grid.L2 { grid-template-columns: calc((100% - 6px) * var(--cx)) 6px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.grid.L4 { grid-template-columns: calc((100% - 6px) * var(--cx)) 6px minmax(0, 1fr); grid-template-rows: calc((100% - 6px) * var(--ry)) 6px minmax(0, 1fr); }
.gut { position: relative; z-index: 2; }
.gut.v { cursor: col-resize; grid-row: 1 / -1; grid-column: 2; }
.gut.h { cursor: row-resize; grid-row: 2; grid-column: 1 / -1; }
.gut::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background 0.15s; }
.gut.v::after { top: 30%; bottom: 30%; left: 2px; width: 2px; }
.gut.h::after { left: 30%; right: 30%; top: 2px; height: 2px; }
.gut:hover::after, .gut.drag::after { background: var(--pane-edge-on); }

.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: 9px; background: var(--pane); border: 0.5px solid var(--pane-edge); overflow: hidden; }
.pane.on { border-color: var(--pane-edge-on); }
.ph { height: 30px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; font-size: 12px; border-bottom: 0.5px solid var(--pane-edge); }
.ph .t { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .agent { color: var(--accent); } .ph .term { color: var(--fg-3); }
.ph .sp { flex: 1; }
.ph .ib { width: 22px; height: 22px; }
.tb { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 6px; font: 12px/1.55 var(--font-mono); color: var(--term-fg); scrollbar-width: thin; }
.tb .ln { white-space: pre-wrap; word-break: break-word; }
.ln.user { background: var(--prompt-bg); color: var(--prompt-fg); padding: 0 6px; border-radius: 2px; margin: 8px 0; font-weight: 500; }
.ln.user::before { content: "❯ "; }
.ln.bullet { margin-top: 8px; padding-left: 2ch; text-indent: -2ch; }
.ln.bullet::before { content: "● "; }
.ln.tool { color: var(--term-dim); margin-top: 6px; padding-left: 2ch; text-indent: -2ch; }
.ln.tool::before { content: "⎿ "; }
.ln.tool b { color: var(--term-fg); font-weight: 500; }
.ln.out { color: var(--term-dim); padding-left: 2ch; }
.ln.note { color: var(--term-dim); font-style: italic; margin-top: 8px; }
.ln.note::before { content: "※ "; font-style: normal; }
.ln.warn { color: var(--amber); margin-top: 6px; } .ln.warn::before { content: "↑ "; }
.ln.err { color: var(--red); padding-left: 2ch; } .ln.err::before { content: "✗ "; margin-left: -2ch; }
.ln.ok { color: var(--green); margin-top: 6px; } .ln.ok::before { content: "✓ "; }
.ln.spin { color: var(--accent); margin-top: 10px; }
.ln.raw { color: var(--term-fg); }
.ln.raw.dim { color: var(--term-dim); }
.ln .g1 { color: var(--green); } .ln .b1 { color: var(--blue); } .ln .a1 { color: var(--amber); }
.banner { display: flex; gap: 14px; align-items: center; margin: 4px 0 14px; }
.banner svg { width: 48px; height: 28px; flex: none; }
.banner .bt { line-height: 1.45; } .banner .bt div:first-child { font-weight: 700; } .banner .bt div:not(:first-child) { color: var(--term-dim); }
.tf { flex: none; padding: 0 12px 7px; font: 12px/1.5 var(--font-mono); }
.tp { display: flex; align-items: center; gap: 8px; border-top: 0.5px solid var(--pane-edge); border-bottom: 0.5px solid var(--pane-edge); padding: 5px 0; color: var(--term-fg); }
.tp input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font: 12px var(--font-mono); caret-color: var(--accent); padding: 0; }
.tp input::placeholder { color: var(--fg-4); }
.st { color: var(--term-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.st .bar { color: var(--green); letter-spacing: -1px; }
.hint { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint .b1 { color: var(--blue); }

/* files pane */
.fsearch { display: flex; gap: 6px; padding: 8px; }
.fsearch input { flex: 1; min-width: 0; height: 26px; border-radius: 6px; border: 0.5px solid var(--pane-edge); background: var(--hover); padding: 0 8px; font-size: 12px; outline: 0; }
.fsearch .ib { border: 0.5px solid var(--pane-edge); font-size: 11px; width: 30px; }
.ftree { flex: 1; overflow-y: auto; padding: 0 6px 8px; font-size: 12.5px; }
.ft { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border-radius: 5px; white-space: nowrap; color: var(--fg); width: 100%; text-align: left; }
.ft:hover { background: var(--hover); }
.ft .n { color: var(--fg-3); font-size: 11px; }
.ft .html { color: var(--red); } .ft .py { color: var(--blue); } .ft .sql { color: var(--amber); } .ft .dir { color: var(--fg-3); } .ft .md { color: var(--violet); }

/* empty / new environment */
.empty { height: 100%; display: grid; place-content: center; justify-items: center; gap: 26px; padding: 20px; border-radius: 9px; }
.empty .mark { width: 54px; height: 54px; border-radius: 14px; background: var(--hover); display: grid; place-items: center; color: var(--fg-3); }
.empty .mark svg { width: 26px; height: 26px; }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.card { width: 168px; padding: 12px; border-radius: 9px; text-align: left; background: var(--pane); border: 0.5px solid var(--pane-edge); display: grid; gap: 6px; }
.card:hover { border-color: var(--pane-edge-on); }
.card .ct { font-weight: 500; font-size: 12.5px; } .card .cs { font-size: 11.5px; color: var(--fg-3); }

/* ---------- browser */
.browser { height: 100%; display: flex; flex-direction: column; border-radius: 9px; background: var(--pane); border: 0.5px solid var(--pane-edge); overflow: hidden; }
.b-tabs { height: 32px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; border-bottom: 0.5px solid var(--pane-edge); }
.btab { height: 26px; max-width: 220px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 7px 7px 0 0; font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
.btab[aria-selected="true"] { background: var(--hover); color: var(--fg); }
.btab .fav { width: 8px; height: 8px; border-radius: 2px; background: var(--page-accent); flex: none; }
.btab .fav.ui { background: var(--accent); }
.btab span.l { overflow: hidden; text-overflow: ellipsis; }
.b-bar { height: 38px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.addr { flex: 1; min-width: 0; height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 7px; background: var(--hover); border: 0.5px solid var(--pane-edge); font-size: 12px; color: var(--fg-2); }
.addr .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .addr .u b { color: var(--fg); font-weight: 500; }
.addr .live { margin-left: auto; font-size: 10.5px; color: var(--green); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.addr .live .dot { background: var(--green); animation: pulse 2s infinite; }
.vp { display: flex; gap: 2px; }
.b-view { flex: 1; min-height: 0; overflow: auto; background: var(--page-desk); display: flex; justify-content: center; }
.frame { width: 100%; min-height: 100%; background: var(--page-bg); color: var(--page-fg); transition: width 0.25s ease; box-shadow: 0 0 0 0.5px var(--page-line); }
.frame.tablet { width: 768px; } .frame.phone { width: 390px; }

function gutter(dir) {

function send(sid, text) {

    s.lines.push(["raw", "$ " + esc(text)]);

    out.forEach(o => s.lines.push(["raw", o]));
    refreshSession(sid); return;
  }
  s.lines = s.lines.filter(l => l[0] !== "spin");
  s.lines.push(["user", text], ["spin", "Thinking… (0s · ↓ 0 tokens)"]);
  refreshSession(sid);
  setTimeout(() => {

function wireStage(r) {
  const stage = $("#stage"), svg = $("#dgsvg");
  const bounds = { x: 0, y: 40, w: Math.max(...r.nodes.map(n => n[3])) + NW + 40, h: Math.max(...r.nodes.map(n => n[4])) + NH + 40 - 40 };
  const fit = () => {
    const sw = svg.clientWidth || 600, sh = svg.clientHeight || 400, ar = sw / sh;
    let w = bounds.w + 70, h = bounds.h + 140;
    if (w / h > ar) h = w / ar; else w = h * ar;
    // Leave room on the right for the review card on wide stages.
    const shift = sw > 900 ? w * 0.16 : 0;
    const lift = sw > 900 ? h * 0.14 : 0;
    view = { x: bounds.x + bounds.w / 2 - w / 2 + shift, y: bounds.y + bounds.h / 2 - h / 2 + lift, w, h };
  };
  if (!view) fit();
  const apply = () => svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  apply();
  const zoom = (f, cx, cy) => {
    const b = svg.getBoundingClientRect();
    const px = view.x + ((cx - b.left) / b.width) * view.w, py = view.y + ((cy - b.top) / b.height) * view.h;
    const nw = Math.min(6000, Math.max(300, view.w * f)), k = nw / view.w;
    view = { x: px - (px - view.x) * k, y: py - (py - view.y) * k, w: nw, h: view.h * k }; apply();
  };
  stage.querySelectorAll("[data-z]").forEach(b => (b.onclick = () => {
    const bb = svg.getBoundingClientRect();
    if (b.dataset.z === "fit") { fit(); apply(); } else zoom(b.dataset.z === "in" ? 0.8 : 1.25, bb.left + bb.width / 2, bb.top + bb.height / 2);
  }));
  svg.addEventListener("wheel", e => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
  let last = null;
  svg.addEventListener("pointerdown", e => { last = [e.clientX, e.clientY]; svg.setPointerCapture(e.pointerId); stage.classList.add("drag"); });
  svg.addEventListener("pointermove", e => {
    if (!last) return; const b = svg.getBoundingClientRect();
    view.x -= (e.clientX - last[0]) * view.w / b.width; view.y -= (e.clientY - last[1]) * view.h / b.height; last = [e.clientX, e.clientY]; apply();
  });
  const up = () => { last = null; stage.classList.remove("drag"); };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
}
