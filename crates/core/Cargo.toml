[package]
name = "backspace-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
backspace-runner = { path = "../runner" }
# Durable workspaces (the `colony_*` tools); docs/COLONY.md.
backspace-colony = { path = "../colony" }
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
# Canonical paths without Windows' \? prefix, which git cannot take.
dunce = "1"
# Browser and desktop use (hands/): Chrome DevTools over a local websocket,
# screenshots scaled for the model, the mouse and keyboard.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }

# The Mac takes its screenshots with `screencapture`; Linux with grim/import.
[target.'cfg(windows)'.dependencies]
xcap = "0.9"
