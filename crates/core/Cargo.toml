[package]
name = "backspace-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
backspace-runner = { path = "../runner" }
# Durable workspaces (the `colony_*` tools); docs/COLONY.md.
backspace-colony = { path = "../colony" }
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
# Canonical paths without Windows' \? prefix, which git cannot take.
dunce = "1"
# Read-only reader for OpenCode's session database (usage.rs); bundled so no system SQLite is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
