[package]
name = "backspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI desktop shell for the Backspace agent harness"

[[bin]]
name = "backspace"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
backspace-core = { path = "../core" }
cauldron-chrome = { path = "../chrome" }
# Pins the matching gpui-pre release, platform layer, components and icons.
gpui-kit = "0.6.6"
tokio.workspace = true

[dev-dependencies]
# Headless windows, element bounds and accessible names for the shell's layout tests.
gpui-kit = { version = "0.6.6", features = ["test-support"] }
serde_json.workspace = true
