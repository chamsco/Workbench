[package]
name = "backspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI desktop shell for the Backspace agent harness"

[[bin]]
name = "backspace"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64 = "0.22"
backspace-core = { path = "../core" }
backspace-runner = { path = "../runner" }
cauldron-chrome = { path = "../chrome" }
# Pins the matching gpui-pre release, platform layer, components and icons.
gpui-kit = "0.6.6"
tokio.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The backdrop painting: decoded, blurred once and cached (src/shell/backdrop.rs). The versions
# GPUI already builds.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
smallvec = "1"

# The in-app browser (src/shell/browser.rs): WebView2 on Windows, WKWebView on macOS. Linux has
# no GTK loop under GPUI for WebKitGTK, so it is left out there.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57"
# The notification-area icon (src/background.rs): Open and Quit while the window is hidden.
# Linux would need a GTK loop under GPUI, so it is left out there and closing quits.
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
# Hiding and showing the window behind the tray icon.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
# `CAULDRON_SHOTS=<dir>` renders the shell headless and writes PNGs (macOS, src/shell/shots.rs).
shots = ["gpui-kit/test-support"]

[dev-dependencies]
# Headless windows, element bounds and accessible names for the shell's layout tests.
gpui-kit = { version = "0.6.6", features = ["test-support"] }
