[package]
name = "backspace-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri desktop shell for the Backspace agent harness"

[[bin]]
name = "backspace-tauri"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
backspace-core = { path = "../core" }
backspace-colony = { path = "../colony" }
# A real PTY for the terminal canvas (ConPTY on Windows, forkpty elsewhere).
portable-pty = "0.9"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
window-vibrancy = "0.6"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
