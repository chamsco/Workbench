<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div class="win" id="win">
    <div class="lights" aria-hidden="true"><span>×</span><span>−</span><span>+</span></div>
    <aside class="side" id="side" aria-label="Machine, projects and agents">
      <div class="side-top" data-tauri-drag-region>
        <button class="ib" id="sideClose" aria-label="Hide sidebar" data-icon="sidebar"></button>
      </div>
      <div class="side-head">
        <div class="brand" id="brand"></div>
        <div class="seg" role="group" aria-label="Sidebar view" id="seg"></div>
      </div>
      <div class="list" id="list"></div>
      <div class="ports" id="ports"></div>
      <div class="side-foot">
        <span class="sp"></span>
        <div class="machines" id="machines" role="group" aria-label="Machines"></div>
        <span class="sp"></span>
        <button class="ib" id="gear" aria-label="Settings" data-icon="gear"></button>
      </div>
    </aside>
    <div class="gutter-side" id="sideGut" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div class="mainc">
      <header class="tbar" data-tauri-drag-region>
        <button class="ib" id="sideOpen" aria-label="Show sidebar" data-icon="sidebar" hidden></button>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Tabs"></nav>
        <span class="sp" data-tauri-drag-region></span>
        <div class="right">
          <button class="ib" id="addCanvas" aria-label="Add a canvas" title="Add a canvas" data-icon="plus"></button>
          <button class="cta" id="cta" aria-expanded="false" aria-controls="drawer"></button>
          <button class="upd" id="upd"></button>
        </div>
      </header>
      <section class="canvas" id="canvas"><div class="grid" id="grid"></div></section>
      <section class="settings" id="settings" hidden></section>
      <aside class="drawer" id="drawer" aria-label="Tickets and reviews" hidden></aside>
    </div>
    <div class="scrim" id="scrim"></div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<script src="app.js"></script>
</body>
</html>
