<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backspace</title>
<style>@layer bs-reset;</style>
<link rel="stylesheet" href="chat-web/whirl.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div class="desk">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div class="win" id="win">
    <div class="lights" aria-hidden="true"><span>×</span><span>−</span><span>+</span></div>
    <nav class="rail" id="rail" aria-label="Zones" data-tauri-drag-region>
      <div class="rail-zones" id="railZones" role="tablist" aria-orientation="vertical"></div>
      <div class="rail-apps" id="railApps"></div>
      <span class="sp" data-tauri-drag-region></span>
      <button class="rz" id="gear" aria-label="Settings" data-tip="Settings"><span class="sq" data-icon="gear"></span></button>
    </nav>
    <aside class="side" id="side" aria-label="Machine, projects and agents">
      <div class="side-top" data-tauri-drag-region>
        <button class="ib" id="sideClose" aria-label="Hide sidebar" data-icon="sidebar"></button>
      </div>
      <div class="side-head">
        <div class="zone-title" id="zoneTitle"></div>
        <button class="newbtn chat-only" id="newChat" title="New chat (⌘N)"><span data-icon="compose"></span>New chat<kbd>⌘N</kbd></button>
        <label class="search chat-only"><span data-icon="search"></span><input id="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off"><kbd>⌘K</kbd></label>
        <div class="brand code-only" id="brand"></div>
        <div class="seg code-only agents-only" role="group" aria-label="Sidebar view" id="seg"></div>
      </div>
      <div class="list code-only agents-only" id="list"></div>
      <div class="list pair-proj code-only pair-only" id="pairProj"></div>
      <div class="list whirl-list chat-only pair-only" id="chatList" hidden></div>
      <div class="list zone-list" id="zoneList"></div>
      <div class="ports code-only agents-only" id="ports"></div>
    </aside>
    <div class="gutter-side" id="sideGut" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div class="mainc">
      <header class="tbar" data-tauri-drag-region>
        <button class="ib" id="sideOpen" aria-label="Show sidebar" data-icon="sidebar" hidden></button>
        <div class="zones" id="zones" role="tablist" aria-label="Zones"></div>
        <div class="modes" id="modes" role="tablist"></div>
        <button class="vbtn code-only agents-only" id="viewBtn" aria-haspopup="menu" data-popper></button>
        <nav class="tabs code-only agents-only" id="tabs" role="tablist" aria-label="Tabs"></nav>
        <button class="ib code-only agents-only canvas-only" id="addCanvas" aria-label="Add a canvas" title="Add a canvas" data-icon="plus"></button>
        <div class="zone-head" id="zoneHead"></div>
        <div class="chat-head chat-only" id="chatHead"></div>
        <span class="sp" data-tauri-drag-region></span>
        <div class="right">
          <button class="srchbtn" id="searchBtn" aria-label="Search" title="Search projects, agents and chats" data-popper><span data-icon="search"></span>Search<kbd>Ctrl K</kbd></button>
          <button class="ib code-only" id="panelBtn" aria-label="Side panel: history, files, sessions" title="History, files and sessions" aria-pressed="false" data-icon="panelr"></button>
          <button class="ib" id="gearBtn" aria-label="Settings" title="Settings" data-icon="gear"></button>
        </div>
        <div class="caps" id="caps"></div>
      </header>
      <div class="body" id="body">
        <section class="canvas zone" id="canvas"><div class="grid" id="grid"></div></section>
        <section class="chat zone" id="chat" hidden></section>
        <section class="memory zone" id="memory" hidden></section>
        <section class="apps zone" id="apps" hidden></section>
        <div class="split-gut" id="splitGut" role="separator" aria-orientation="vertical" aria-label="Resize split" hidden></div>
        <div class="split-head" id="splitHead" hidden></div>
      </div>
      <aside class="rpanel" id="rpanel" aria-label="History, files and sessions" hidden></aside>
      <section class="settings" id="settings" hidden></section>
      <aside class="drawer" id="drawer" aria-label="Tickets and reviews" hidden></aside>
    </div>
    <footer class="status" aria-label="Status">
      <button class="upd" id="upd"></button>
      <div class="machines" id="machines" role="group" aria-label="Machines"></div>
      <button class="cta code-only agents-only" id="cta" aria-expanded="false" aria-controls="drawer"></button>
      <div class="stm" id="status"></div>
    </footer>
    <div class="scrim" id="scrim"></div>
    <div class="onboard" id="onboard" hidden></div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="memtoast" id="memToast" role="status" aria-live="polite" hidden></div>
<input type="file" id="filePick" multiple hidden>
<script src="art.js"></script>
<script src="app.js"></script>
<script src="picker.js"></script>
<script src="home.js"></script>
<script src="rpanel.js"></script>
<script src="providers.js"></script>
<script src="chat.js"></script>
<script src="onboard.js"></script>
<script src="memory.js"></script>
<script src="apps.js"></script>
<script src="shell.js"></script>
<!-- The chat face: Whirl's components on Backspace (web/, MIT). Deferred, so
     it is defined before app.js boots on DOMContentLoaded. -->
<script type="module" src="chat-web/whirl.js"></script>
</body>
</html>
