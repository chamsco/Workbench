<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Lab</title>
<script src="__backspace/sdk.js"></script>
<style>
  :root { --bg: #fbfafc; --fg: #1d1b20; --dim: #6d6874; --line: rgba(0,0,0,.09); --well: #f1eff4; --card: #fff; --acc: #2563eb; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #1b1a1f; --fg: #eeecf1; --dim: #a19ca8; --line: rgba(255,255,255,.1); --well: #26242b; --card: #222027; --acc: #7aa8ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13.5px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 20px 10px; }
  h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
  .ask { margin: 0 20px; display: grid; gap: 8px; }
  textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--well); color: var(--fg); font: inherit; outline: none; }
  textarea:focus { border-color: var(--acc); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button { height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; padding: 0 10px; }
  select { max-width: 220px; }
  button.go { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; padding: 0 16px; margin-left: auto; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  .vs { color: var(--dim); font-size: 12px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 20px 16px; }
  .col { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
  .col h2 { margin: 0; padding: 9px 12px; font-size: 12px; font-weight: 600; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .col h2 .t { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .out { flex: 1; overflow: auto; padding: 12px; white-space: pre-wrap; word-break: break-word; }
  .out.empty { color: var(--dim); display: grid; place-items: center; text-align: center; }
  .err { color: #d13d32; }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>Prompt Lab</h1><p>One prompt, two models, side by side.</p></header>
<div class="ask">
  <textarea id="q" placeholder="Ask both models something…"></textarea>
  <div class="row"><select id="a" aria-label="First model"></select><span class="vs">vs</span><select id="b" aria-label="Second model"></select><button class="go" id="go">Compare</button></div>
</div>
<main>
  <section class="col"><h2><span id="na">A</span><span class="t" id="ta"></span></h2><div class="out empty" id="oa">Answers stream in here.</div></section>
  <section class="col"><h2><span id="nb">B</span><span class="t" id="tb"></span></h2><div class="out empty" id="ob">Pick two different models to compare.</div></section>
</main>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  const info = await backspace.ready();
  const routes = await backspace.routes();
  if (!routes.length) { $("#oa").textContent = "Switch on a model in Backspace (Settings → Providers) to compare."; $("#go").disabled = true; return; }
  for (const sel of [$("#a"), $("#b")]) sel.innerHTML = routes.map((r, i) => `<option value="${i}">${r.label.replace(/</g, "&lt;")}</option>`).join("");
  const last = (await backspace.storage.get("pick")) || [0, Math.min(1, routes.length - 1)];
  $("#a").value = Math.min(last[0], routes.length - 1); $("#b").value = Math.min(last[1], routes.length - 1);
  $("#q").value = (await backspace.storage.get("prompt")) || "";

  async function run(side, route, prompt) {
    const out = $("#o" + side), t0 = performance.now();
    $("#n" + side).textContent = routes.find(r => r.route === route).label;
    out.className = "out"; out.textContent = "…"; $("#t" + side).textContent = "";
    try {
      const r = await backspace.agent.ask(prompt, { route, onText: text => { out.textContent = text || "…"; } });
      out.textContent = r.text;
    } catch (e) { out.innerHTML = `<span class="err">${String(e.message || e).replace(/</g, "&lt;")}</span>`; }
    $("#t" + side).textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s";
  }
  $("#go").onclick = async () => {
    const prompt = $("#q").value.trim(); if (!prompt) { $("#q").focus(); return; }
    const a = routes[+$("#a").value].route, b = routes[+$("#b").value].route;
    backspace.storage.set("pick", [+$("#a").value, +$("#b").value]); backspace.storage.set("prompt", prompt);
    $("#go").disabled = true;
    await Promise.all([run("a", a, prompt), run("b", b, prompt)]);
    $("#go").disabled = false;
  };
  $("#q").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#go").click(); };
})();
</script>
</body>
</html>
