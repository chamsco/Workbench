[workspace]
resolver = "2"
members = ["crates/runner", "crates/core", "crates/cli", "crates/app", "crates/tauri-app"]
default-members = ["crates/runner", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "net", "io-util"] }
toml = "0.8"
