<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Workbench turns one sentence into merged code</title>
  <desc id="d">Five steps. You describe the goal, approve a plan, and review the diff. Workbench interviews you, runs one agent per ticket on its own branch, and checks the work before you see it.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec2"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ec2"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
  </defs>

  <style>
    .panel  { fill: #17161c; }
    .hem    { fill: none; stroke: #ffffff; stroke-opacity: .07; }
    .h1     { fill: #f4f1f7; font: 650 20px/1 -apple-system, "Segoe UI", system-ui, sans-serif; letter-spacing: -.2px; }
    .h2     { fill: #9c95a8; font: 400 12.5px/1 -apple-system, "Segoe UI", system-ui, sans-serif; }
    .ttl    { fill: #f1edf6; font: 600 14px/1 -apple-system, "Segoe UI", system-ui, sans-serif; }
    .sub    { fill: #a29bb0; font: 400 11.5px/1 -apple-system, "Segoe UI", system-ui, sans-serif; }
    .you    { fill: #ffb7d3; font-weight: 600; }
    .num    { fill: #cfc8da; font: 600 11px/1 ui-monospace, "SF Mono", Consolas, monospace; }
    .numyou { fill: #1b1a21; }
    .track  { stroke: #ffffff; stroke-opacity: .12; stroke-width: 2; stroke-linecap: round; }
    .dot    { fill: #1f1e26; stroke: #ffffff; stroke-opacity: .16; }
    .dotyou { fill: url(#accent); stroke: none; }
    .ring   { fill: none; stroke: url(#accent); stroke-width: 1.6; }
    .node, .halo, .fillbar, .comet { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .node { opacity: 0; }
    .halo { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .fillbar { transform-box: fill-box; transform-origin: 50% 0%; }
    .comet { opacity: 0; }

    @keyframes n0 { 0%{opacity:0;transform:translateY(9px)} 5%{opacity:1;transform:translateY(0)} 86%{opacity:1;transform:translateY(0)} 92%{opacity:0;transform:translateY(0)} 100%{opacity:0;transform:translateY(0)} }
    @keyframes n1 { 0%,12%{opacity:0;transform:translateY(9px)} 17%{opacity:1;transform:translateY(0)} 86%{opacity:1;transform:translateY(0)} 92%{opacity:0;transform:translateY(0)} 100%{opacity:0;transform:translateY(0)} }
    @keyframes n2 { 0%,24%{opacity:0;transform:translateY(9px)} 29%{opacity:1;transform:translateY(0)} 86%{opacity:1;transform:translateY(0)} 92%{opacity:0;transform:translateY(0)} 100%{opacity:0;transform:translateY(0)} }
    @keyframes n3 { 0%,36%{opacity:0;transform:translateY(9px)} 41%{opacity:1;transform:translateY(0)} 86%{opacity:1;transform:translateY(0)} 92%{opacity:0;transform:translateY(0)} 100%{opacity:0;transform:translateY(0)} }
    @keyframes n4 { 0%,48%{opacity:0;transform:translateY(9px)} 53%{opacity:1;transform:translateY(0)} 86%{opacity:1;transform:translateY(0)} 92%{opacity:0;transform:translateY(0)} 100%{opacity:0;transform:translateY(0)} }
    .n0{animation-name:n0} .n1{animation-name:n1} .n2{animation-name:n2} .n3{animation-name:n3} .n4{animation-name:n4}

    @keyframes r0 { 0%{opacity:.30;transform:scale(.55)} 13%{opacity:0;transform:scale(1.7)} 100%{opacity:0;transform:scale(1.7)} }
    @keyframes r1 { 0%,12%{opacity:.30;transform:scale(.55)} 25%{opacity:0;transform:scale(1.7)} 100%{opacity:0;transform:scale(1.7)} }
    @keyframes r2 { 0%,24%{opacity:.30;transform:scale(.55)} 37%{opacity:0;transform:scale(1.7)} 100%{opacity:0;transform:scale(1.7)} }
    @keyframes r3 { 0%,36%{opacity:.30;transform:scale(.55)} 49%{opacity:0;transform:scale(1.7)} 100%{opacity:0;transform:scale(1.7)} }
    @keyframes r4 { 0%,48%{opacity:.30;transform:scale(.55)} 61%{opacity:0;transform:scale(1.7)} 100%{opacity:0;transform:scale(1.7)} }
    .r0{animation-name:r0} .r1{animation-name:r1} .r2{animation-name:r2} .r3{animation-name:r3} .r4{animation-name:r4}

    @keyframes spine { 0%{transform:scaleY(.01);opacity:1} 52%{transform:scaleY(1);opacity:1} 86%{transform:scaleY(1);opacity:1} 92%{transform:scaleY(1);opacity:0} 100%{transform:scaleY(1);opacity:0} }
    .fillbar { animation-name: spine; animation-timing-function: cubic-bezier(.23,1,.32,1); }

    /* The pulse travels at a constant speed: it is the one continuous motion here. */
    @keyframes comet { 0%{transform:translateY(0);opacity:0} 3%{opacity:1} 49%{opacity:1} 52%{transform:translateY(296px);opacity:0} 100%{transform:translateY(296px);opacity:0} }
    .comet { animation-name: comet; animation-timing-function: cubic-bezier(.23,1,.32,1); }

    @media (prefers-reduced-motion: reduce) {
      /* Fewer and gentler: the finished diagram is the comprehension-preserving form. */
      .node, .halo, .fillbar, .comet { animation: none !important; }
      .node { opacity: 1; transform: none; }
      .fillbar { opacity: 1; transform: none; }
      .comet, .halo { opacity: 0; }
    }
  </style>

  <rect class="panel" x="0" y="0" width="880" height="470" rx="18"/>
  <rect class="hem" x="0.5" y="0.5" width="879" height="469" rx="18"/>

  <text class="h1" x="34" y="47">From one sentence to merged code</text>
  <text class="h2" x="34" y="73">Workbench runs the whole loop. You make two decisions, both marked in pink.</text>

  <line class="track" x1="74" y1="122" x2="74" y2="418"/>
  <rect class="fillbar" x="73.2" y="122" width="1.6" height="296" fill="url(#spine)" rx="0.8"/>
  <circle class="comet" cx="74" cy="122" r="4" fill="url(#accent)"/>

  <g class="node n0">
    <circle class="halo r0" cx="74" cy="122" r="19" fill="url(#accent)"/>
    <circle class="dot" cx="74" cy="122" r="13"/>
    <text class="num" x="74" y="126" text-anchor="middle">1</text>
    <text class="ttl" x="104" y="127">You describe the goal</text>
    <text class="sub" x="104" y="146">Plain English. Point it at a folder.</text>
  </g>

  <g class="node n1">
    <circle class="halo r1" cx="74" cy="196" r="19" fill="url(#accent)"/>
    <circle class="dotyou" cx="74" cy="196" r="13"/>
    <text class="num numyou" x="74" y="200" text-anchor="middle">2</text>
    <text class="ttl" x="104" y="201">It interviews you, then writes the plan</text>
    <text class="sub" x="104" y="220">Numbered questions, then tickets. <tspan class="you">You approve the plan.</tspan></text>
  </g>

  <g class="node n2">
    <circle class="halo r2" cx="74" cy="270" r="19" fill="url(#accent)"/>
    <circle class="dot" cx="74" cy="270" r="13"/>
    <text class="num" x="74" y="274" text-anchor="middle">3</text>
    <text class="ttl" x="104" y="275">Agents build it in parallel</text>
    <text class="sub" x="104" y="294">One agent per ticket, each on its own git branch.</text>
  </g>

  <g class="node n3">
    <circle class="halo r3" cx="74" cy="344" r="19" fill="url(#accent)"/>
    <circle class="dot" cx="74" cy="344" r="13"/>
    <text class="num" x="74" y="348" text-anchor="middle">4</text>
    <text class="ttl" x="104" y="349">Checks run before you look</text>
    <text class="sub" x="104" y="368">A failing ticket goes straight back to its agent.</text>
  </g>

  <g class="node n4">
    <circle class="halo r4" cx="74" cy="418" r="19" fill="url(#accent)"/>
    <circle class="dotyou" cx="74" cy="418" r="13"/>
    <text class="num numyou" x="74" y="422" text-anchor="middle">5</text>
    <text class="ttl" x="104" y="423"><tspan class="you">You review the diff</tspan>, then it merges</text>
    <text class="sub" x="104" y="442">Approve it, or send it back with your feedback.</text>
  </g>
</svg>
